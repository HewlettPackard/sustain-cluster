# OPTIMIZED Configuration for Parallel PPO with LLM
# configs/env/ppo_algorithm_config_parallel.yaml

ppo_algorithm:
  # --- FIXED: Training Loop Parameters for Parallel Environments ---
  total_timesteps: 5000000   # REDUCED from 200M: 5M is plenty for development
  learning_rate: 0.0003      # Keep same
  num_steps: 512             # REDUCED from 2048: Parallel envs collect data faster
                            # With 8 envs × 3 agents × 512 steps = 12,288 steps per update (much better!)
  
  # --- PPO-Specific Hyperparameters ---
  update_epochs: 4           # REDUCED from 5: Less epochs needed with more data
  minibatch_size: 256        # INCREASED from 128: More data per batch with parallel envs
  
  gamma: 0.99               # Keep same
  gae_lambda: 0.90          # Keep same  
  clip_coef: 0.25           # Keep same

  # --- Loss Function Coefficients ---
  ent_coef: 0.02            # INCREASED from 0.01: More exploration with LLM guidance
  vf_coef: 0.5              # Keep same
  
  # --- Technical Parameters ---
  max_grad_norm: 0.5        # Keep same
  
  # --- OPTIMIZED: Evaluation and Saving for Parallel Training ---
  eval_frequency: 20        # MUCH more frequent: Every 20 updates instead of 50000 steps
  eval_episodes: 3          # REDUCED from 1: Faster evaluation
  save_frequency: 50        # FREQUENT checkpoints: Every 50 updates